<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Preload the two primary font weights actually used above the fold
		     (regular body + bold headings) so first paint isn't blocked on the
		     CSS @font-face round-trip. Light/medium load on demand via swap. -->
		<link rel="preload" href="/fonts/sawtoncircular/sawtoncircular-regular-webfont.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/sawtoncircular/sawtoncircular-bold-webfont.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

		<!-- Warm up the analytics origins so deferred third-party JS connects fast. -->
		<link rel="preconnect" href="https://us-assets.i.posthog.com" crossorigin />
		<link rel="dns-prefetch" href="https://us.i.posthog.com" />
		<link rel="dns-prefetch" href="https://www.googletagmanager.com" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
